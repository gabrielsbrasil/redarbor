name: Atualizar consumo Redarbor via Supabase

# Roda automaticamente 1x por dia (ajuste o horário se quiser) e também
# permite disparo manual em Actions -> Atualizar consumo Redarbor via Supabase -> Run workflow.
on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC = 06:00 em Brasília. Ajuste se quiser outro horário.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar-consumo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests

      - name: Gerar data/redarbor_supabase.csv a partir do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python gerar_redarbor.py

      # Commits feitos pelo GITHUB_TOKEN não disparam outros workflows
      # automaticamente (proteção do GitHub contra loop infinito). Por isso
      # regeneramos o manifest.json aqui mesmo, no mesmo job, em vez de
      # depender do workflow "build-data-manifest.yml".
      - name: Regenerar data/manifest.json
        run: |
          cd data
          python3 - <<'PY'
          import json, os

          files = sorted(
              f for f in os.listdir(".")
              if f.lower().endswith(".csv") and f.lower() != "manifest.json"
          )
          manifest = [{"name": f} for f in files]
          with open("manifest.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, ensure_ascii=False, indent=2)
          print("manifest.json gerado com", len(manifest), "arquivo(s):", files)
          PY

      - name: Commitar o CSV e o manifest atualizados (se algo mudou)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/redarbor_supabase.csv data/manifest.json
          if git diff --cached --quiet; then
            echo "Nada mudou no consumo, não é preciso commitar."
          else
            git commit -m "auto: atualiza consumo Redarbor via Supabase $(date +'%d/%m/%Y %H:%M')"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          fi
